[project]
name = "ds-ibtracs-matching"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "matplotlib>=3.10.8",
    "ocha-stratus>=0.1.7",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter-black>=0.4.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[tool.setuptools]
packages = ["src", "src.datasources"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
